name: Rename test JavaScript files

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the renames without committing them"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename versioned test JavaScript files
        id: rename
        env:
          DRY_RUN: \${{ inputs.dry_run }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          tests_dir = Path("js/tests")
          # Examples:
          # v1-test.js       -> v0.1.0-test.js
          # v5.6-test.js     -> v0.5.6-test.js
          # v10-test-auto.js -> v1.0.0-test-auto.js
          pattern = re.compile(r"^v(\d+)(?:\.(\d+))?(-[A-Za-z0-9.-]+)\.js$")

          planned = []
          if tests_dir.is_dir():
              for source in sorted(tests_dir.rglob("v*.js")):
                  match = pattern.match(source.name)
                  if not match:
                      print(f"Skipping unrecognised filename: {source}")
                      continue

                  first, second, suffix = match.groups()
                  number = int(first)

                  if second is not None:
                      major, minor, patch = 0, number, int(second)
                  else:
                      major, minor, patch = number // 10, number % 10, 0

                  target = source.with_name(
                      f"v{major}.{minor}.{patch}{suffix}.js"
                  )
                  if source != target:
                      planned.append((source, target))

          if not planned:
              print("No test JavaScript files need renaming.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("changed=false\n")
              sys.exit(0)

          sources = {source.resolve() for source, _ in planned}
          for source, target in planned:
              if target.exists() and target.resolve() not in sources:
                  raise SystemExit(f"Refusing to overwrite existing file: {target}")

          print("Planned renames:")
          for source, target in planned:
              print(f"  {source} -> {target}")

          if os.environ.get("DRY_RUN", "false").lower() == "true":
              print("Dry run enabled; no files changed.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("changed=false\n")
              sys.exit(0)

          # Update references before moving the original files.
          replacements = {
              source.as_posix(): target.as_posix()
              for source, target in planned
          }
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode("utf-8", errors="surrogateescape").split("\0")

          for filename in filter(None, tracked):
              path = Path(filename)
              # Never rewrite workflow files: the Actions token cannot push
              # workflow changes without the separate Workflows permission.
              if path.parts[:2] == (".github", "workflows"):
                  continue
              if not path.is_file():
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
                  updated = updated.replace(Path(old).name, Path(new).name)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Updated references in {path}")

          # Use temporary names to avoid collisions during multi-file renames.
          temporary = []
          for index, (source, target) in enumerate(planned):
              temp = source.with_name(f".rename-tmp-{index}-{source.name}")
              source.rename(temp)
              temporary.append((temp, target))

          for temp, target in temporary:
              target.parent.mkdir(parents=True, exist_ok=True)
              temp.rename(target)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("changed=true\n")
          PY

      - name: Commit and push changes
        if: steps.rename.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Rename test JavaScript files using semantic versioning"
          git push
