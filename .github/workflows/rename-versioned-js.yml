name: Rename versioned JavaScript files

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the renames without committing them"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename versioned JavaScript files
        id: rename
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          js_dir = Path("js")
          pattern = re.compile(r"^v(\d+)(?:\.(\d+))?(-[A-Za-z0-9.-]+)?\.js$")

          planned = []
          for source in sorted(js_dir.glob("v*.js")):
              match = pattern.match(source.name)
              if not match:
                  print(f"Skipping unrecognised filename: {source}")
                  continue

              first, second, suffix = match.groups()
              number = int(first)

              if second is not None:
                  # Existing dotted versions such as v5.6.js -> v0.5.6.js
                  major, minor, patch = 0, number, int(second)
              else:
                  # Sequential versions: v1..v9 -> 0.N.0; v10 -> 1.0.0;
                  # v11 -> 1.1.0, etc.
                  major, minor, patch = number // 10, number % 10, 0

              target = js_dir / f"v{major}.{minor}.{patch}{suffix or ''}.js"
              if source != target:
                  planned.append((source, target))

          if not planned:
              print("No versioned JavaScript files need renaming.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("changed=false\n")
              sys.exit(0)

          sources = {source.resolve() for source, _ in planned}
          for source, target in planned:
              if target.exists() and target.resolve() not in sources:
                  raise SystemExit(f"Refusing to overwrite existing file: {target}")

          print("Planned renames:")
          for source, target in planned:
              print(f"  {source} -> {target}")

          if os.environ.get("DRY_RUN", "false").lower() == "true":
              print("Dry run enabled; no files changed.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("changed=false\n")
              sys.exit(0)

          # Rename through temporary names first, allowing safe swaps if ever needed.
          temporary = []
          for index, (source, target) in enumerate(planned):
              temp = source.with_name(f".rename-tmp-{index}-{source.name}")
              source.rename(temp)
              temporary.append((temp, target))

          for temp, target in temporary:
              target.parent.mkdir(parents=True, exist_ok=True)
              temp.rename(target)

          # Update references to renamed filenames in tracked UTF-8 text files.
          replacements = {
              source.as_posix(): target.as_posix()
              for source, target in planned
          }
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=True
          ).split("\0")

          for filename in filter(None, tracked):
              path = Path(filename)
              if not path.is_file():
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
                  updated = updated.replace(Path(old).name, Path(new).name)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Updated references in {path}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("changed=true\n")
          PY

      - name: Commit and push changes
        if: steps.rename.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Rename JavaScript versions using semantic versioning"
          git push
